uri: /${{PREFIX}}/*
name: ${{NAME}}
plugins:
  authz-keycloak:
    _meta:
      disable: false
      filter:
        - - request_uri
          - "!"
          - ~~
          - ^/[^/]*/ping$
    client_id: apisix
    client_secret: ${{CLIENT_SECRET}}
    discovery: http://${{KEYCLOAK_IP:PORT}}/realms/wimetrix/.well-known/uma2-configuration
    lazy_load_paths: true
  cors:
    _meta:
      disable: false
    allow_credential: false
    allow_headers: "*"
    allow_methods: "*"
    allow_origins: "*"
    expose_headers: "*"
    max_age: 5
  proxy-rewrite:
    regex_uri:
      - ^/[^/]*/(.*)$
      - /$1
  serverless-pre-function:
    functions:
      - |-
        return function()
          local core = require "apisix.core";
          local token = "token";
          core.request.set_header("x-apisix-token", token);
        end
    phase: before_proxy
upstream:
  nodes:
    - host: ${{UPSTREAM_IP}}
      port: ${{UPSTREAM_PORT}}
      weight: 1
  type: roundrobin
status: 1
