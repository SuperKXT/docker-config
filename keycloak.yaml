services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: mssql
      KC_DB_URL_HOST: 172.16.21.255
      KC_DB_URL_PORT: 1433
      KC_DB_URL_DATABASE: SooperWizerDev
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: spts@3311
      KC_DB_URL_PROPERTIES: ";trustServerCertificate=true;encrypted=false"
      KC_DB_SCHEMA: auth
      KC_TRANSACTION_XA_ENABLED: "false"
      # KC_LOG_LEVEL: DEBUG
    command: start-dev --features=token-exchange,admin-fine-grained-authz
    restart: unless-stopped
